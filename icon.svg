<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#080814"/>
    </linearGradient>
    <filter id="borderglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
    </filter>
    <filter id="letterglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Border glow bloom -->
  <rect x="14" y="14" width="484" height="484" rx="84"
        fill="none" stroke="#c9a040" stroke-width="20" stroke-opacity=".55"
        filter="url(#borderglow)"/>

  <!-- Main gold border -->
  <rect x="14" y="14" width="484" height="484" rx="84"
        fill="none" stroke="#c9a040" stroke-width="13" stroke-opacity=".9"/>

  <!-- Inner soft accent line -->
  <rect x="28" y="28" width="456" height="456" rx="72"
        fill="none" stroke="rgba(255,215,100,.22)" stroke-width="1.5"/>

  <!-- Gold serif L — with glow -->
  <text x="258" y="372"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',Palatino,serif"
        font-size="272"
        font-weight="bold"
        fill="#c9a040"
        filter="url(#letterglow)">L</text>
</svg>
