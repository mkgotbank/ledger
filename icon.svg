<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1c1c2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle inner fill -->
  <rect x="16" y="16" width="480" height="480" rx="82" fill="rgba(201,160,64,0.05)"/>

  <!-- Gold border -->
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none"
        stroke="#c9a040" stroke-width="9" stroke-opacity="0.65"/>

  <!-- Inner accent border -->
  <rect x="22" y="22" width="468" height="468" rx="77" fill="none"
        stroke="#c9a040" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Gold "L" — geometric paths for pixel-perfect rendering -->
  <!-- Vertical stroke -->
  <rect x="138" y="108" width="88" height="298" rx="8" fill="#c9a040"/>
  <!-- Horizontal stroke (shares bottom of vertical) -->
  <rect x="138" y="318" width="238" height="88" rx="8" fill="#c9a040"/>

  <!-- Subtle glow on the L -->
  <rect x="138" y="108" width="88" height="298" rx="8" fill="#d4b04a" opacity="0.18"/>
  <rect x="138" y="318" width="238" height="88" rx="8" fill="#d4b04a" opacity="0.18"/>
</svg>
