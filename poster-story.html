<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Flash Sale — The Ledger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#050510;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'Courier New',monospace;
  gap:0;
}
canvas{
  display:block;
  /* Scale to fit, preserve 9:16 */
  max-width:100vw;
  max-height:calc(100svh - 56px);
  width:auto;height:auto;
}
.bar{
  width:100%;display:flex;justify-content:center;align-items:center;
  height:56px;flex-shrink:0;
  background:rgba(5,5,16,0.95);
  border-top:1px solid rgba(201,160,64,0.12);
}
.save-btn{
  background:rgba(201,160,64,0.13);
  border:1px solid rgba(201,160,64,0.32);
  color:#c9a040;border-radius:10px;
  padding:9px 28px;
  font:700 11px/1 'Courier New',monospace;
  letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;
}
.save-btn:active{opacity:.65;}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="bar">
  <button class="save-btn" id="btn" onclick="savePNG()">⬇ Save to Gallery</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 1080, H = 1920;
canvas.width  = W;
canvas.height = H;

/* ── roundRect polyfill ── */
if(!ctx.roundRect){
  ctx.roundRect = function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y);        this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,  x+w,y+r);
    this.lineTo(x+w,y+h-r);   this.quadraticCurveTo(x+w,y+h, x+w-r,y+h);
    this.lineTo(x+r,y+h);     this.quadraticCurveTo(x,y+h,   x,y+h-r);
    this.lineTo(x,y+r);        this.quadraticCurveTo(x,y,      x+r,y);
    this.closePath();
  };
}

/* ── text wrap helper ── */
function wrapText(txt, x, y, maxW, lineH){
  const words = txt.split(' ');
  let line = '';
  for(let i=0;i<words.length;i++){
    const test = line + words[i] + ' ';
    if(ctx.measureText(test).width > maxW && i>0){
      ctx.fillText(line.trimEnd(), x, y); line = words[i]+' '; y += lineH;
    } else { line = test; }
  }
  ctx.fillText(line.trimEnd(), x, y);
}

function draw(){
  const pad = 72;
  const aw  = W - pad*2;   // 936px available width

  /* ─── BACKGROUND ─── */
  const bgG = ctx.createLinearGradient(0,0,0,H);
  bgG.addColorStop(0,   '#0f0f1e');
  bgG.addColorStop(0.5, '#0a0a16');
  bgG.addColorStop(1,   '#070710');
  ctx.fillStyle = bgG;
  ctx.fillRect(0,0,W,H);

  /* top ambient gold glow */
  const tg = ctx.createRadialGradient(W/2,0,0, W/2,0, 700);
  tg.addColorStop(0,'rgba(201,160,64,0.13)');
  tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0,0,W,H*0.45);

  /* bottom ambient glow */
  const bg2 = ctx.createRadialGradient(W/2,H,0, W/2,H, 500);
  bg2.addColorStop(0,'rgba(100,60,180,0.07)');
  bg2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = bg2;
  ctx.fillRect(0,H*0.6,W,H*0.4);

  /* ─── TOP GOLD LINE ─── */
  const lg = ctx.createLinearGradient(0,0,W,0);
  lg.addColorStop(0,   'rgba(201,160,64,0)');
  lg.addColorStop(0.2, 'rgba(201,160,64,0.7)');
  lg.addColorStop(0.5, 'rgba(232,192,96,1)');
  lg.addColorStop(0.8, 'rgba(201,160,64,0.7)');
  lg.addColorStop(1,   'rgba(201,160,64,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0,0,W,5);

  /* ─── HEADER ─── */
  ctx.letterSpacing = '8px';
  ctx.font = "bold 30px 'Courier New',monospace";
  ctx.textAlign  = 'left';
  ctx.fillStyle  = '#c9a040';
  ctx.fillText('THE LEDGER', pad, 115);

  ctx.letterSpacing = '3px';
  ctx.font = "22px 'Courier New',monospace";
  ctx.textAlign = 'right';
  ctx.fillStyle = '#606078';
  ctx.fillText('LIMITED TIME', W-pad, 113);

  /* thin separator below header */
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.moveTo(pad,130); ctx.lineTo(W-pad,130); ctx.stroke();

  /* ─── FLASH LABEL ─── */
  const flY = 158, flH = 60;
  ctx.letterSpacing = '4px';
  ctx.font = "bold 22px 'Courier New',monospace";
  const ftw = ctx.measureText('FLASH SALE — LIVE NOW').width + 4*21; // approx with spacing
  const flW = ftw + 68;

  ctx.fillStyle = 'rgba(224,92,92,0.08)';
  ctx.beginPath(); ctx.roundRect(pad,flY,flW,flH,11); ctx.fill();
  ctx.strokeStyle = 'rgba(224,92,92,0.38)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(pad,flY,flW,flH,11); ctx.stroke();

  /* blinking red dot */
  ctx.fillStyle = '#e05c5c';
  ctx.beginPath(); ctx.arc(pad+26,flY+30,7,0,Math.PI*2); ctx.fill();

  ctx.textAlign  = 'left';
  ctx.fillStyle  = '#e05c5c';
  ctx.fillText('FLASH SALE — LIVE NOW', pad+48, flY+38);

  /* ─── HEADLINE ─── */
  ctx.letterSpacing = '-1px';

  /* "NEXT " white */
  ctx.font      = "170px Impact,'Arial Black',sans-serif";
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(235,231,220,0.96)';
  ctx.fillText('NEXT ', pad, 445);
  const nxW = ctx.measureText('NEXT ').width;

  /* "10" gold */
  ctx.fillStyle = '#e8c060';
  ctx.fillText('10', pad+nxW, 445);

  /* "BUYERS" */
  ctx.font      = "210px Impact,'Arial Black',sans-serif";
  ctx.fillStyle = 'rgba(235,231,220,0.96)';
  ctx.fillText('BUYERS', pad, 665);

  /* subtitle */
  ctx.letterSpacing = '5px';
  ctx.font      = "26px 'Courier New',monospace";
  ctx.fillStyle = '#484860';
  ctx.fillText('GET HOOKED UP ON EVERY ORDER', pad, 715);

  /* ─── OFFER CARD ─── */
  const cY = 768, cH = 360;

  /* card background */
  const cg = ctx.createLinearGradient(pad,cY, pad+aw,cY+cH);
  cg.addColorStop(0,'rgba(201,160,64,0.1)');
  cg.addColorStop(1,'rgba(201,160,64,0.025)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.roundRect(pad,cY,aw,cH,26); ctx.fill();

  /* card border */
  ctx.strokeStyle = 'rgba(201,160,64,0.26)';
  ctx.lineWidth   = 1.5;
  ctx.beginPath(); ctx.roundRect(pad,cY,aw,cH,26); ctx.stroke();

  /* card inner glow top-right */
  const cgl = ctx.createRadialGradient(W-pad-60,cY+70,0, W-pad-60,cY+70,200);
  cgl.addColorStop(0,'rgba(201,160,64,0.1)');
  cgl.addColorStop(1,'rgba(201,160,64,0)');
  ctx.fillStyle = cgl;
  ctx.beginPath(); ctx.roundRect(pad,cY,aw,cH,26); ctx.fill();

  /* "THE DEAL" */
  ctx.letterSpacing = '7px';
  ctx.font      = "bold 22px 'Courier New',monospace";
  ctx.textAlign = 'left';
  ctx.fillStyle = '#c9a040';
  ctx.fillText('THE DEAL', pad+46, cY+52);

  /* "+2G" */
  ctx.letterSpacing = '0px';
  ctx.font      = "175px Impact,'Arial Black',sans-serif";
  ctx.fillStyle = '#e8c060';
  ctx.fillText('+2G', pad+38, cY+247);
  const p2w = ctx.measureText('+2G').width;

  /* text shadow / glow behind +2G */
  ctx.shadowColor = 'rgba(232,192,96,0.25)';
  ctx.shadowBlur  = 40;
  ctx.fillText('+2G', pad+38, cY+247);
  ctx.shadowBlur  = 0;

  /* "FREE" */
  ctx.font      = "88px Impact,'Arial Black',sans-serif";
  ctx.fillStyle = '#c9a040';
  ctx.fillText('FREE', pad+38+p2w+18, cY+247);

  /* deal body */
  ctx.letterSpacing = '0.3px';
  ctx.font      = "25px 'Courier New',monospace";
  ctx.fillStyle = '#8888a8';
  wrapText(
    "Cop a Half Oz (14g) or more — get an extra 2g FREE. First come, first served. Next 10 orders only.",
    pad+42, cY+282, aw-84, 40
  );

  /* ─── SLOT COUNTER ─── */
  const slY = cY+cH+52;

  ctx.letterSpacing = '3px';
  ctx.font      = "bold 23px 'Courier New',monospace";
  ctx.textAlign = 'left';
  ctx.fillStyle = '#585870';
  ctx.fillText('0 / 10 CLAIMED', pad, slY+28);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#c05050';
  ctx.fillText('● 10 LEFT', W-pad, slY+28);

  /* progress bar bg */
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(pad, slY+44, aw, 10, 5); ctx.fill();
  /* 0% fill — update width=(claimed/10)*aw when slots are taken */

  /* 10 slots */
  const sgY  = slY+66;
  const sgap = 12;
  const sw   = (aw - sgap*9) / 10;

  for(let i=0;i<10;i++){
    const sx = pad + i*(sw+sgap);
    ctx.fillStyle = 'rgba(201,160,64,0.06)';
    ctx.beginPath(); ctx.roundRect(sx,sgY,sw,64,9); ctx.fill();
    ctx.strokeStyle = 'rgba(201,160,64,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(sx,sgY,sw,64,9); ctx.stroke();
    /* checkmark */
    ctx.letterSpacing = '0px';
    ctx.font = "bold 26px Arial,sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c9a040';
    ctx.fillText('✓', sx+sw/2, sgY+42);
  }

  /* ─── DIVIDER ─── */
  const divY = sgY+64+58;
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad,divY); ctx.lineTo(W-pad,divY); ctx.stroke();

  /* ─── CTA ─── */
  ctx.letterSpacing = '6px';
  ctx.font      = "24px 'Courier New',monospace";
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3a3a56';
  ctx.fillText('HOW TO CLAIM', W/2, divY+54);

  ctx.letterSpacing = '3px';
  ctx.font      = "115px Impact,'Arial Black',sans-serif";
  ctx.fillStyle = '#e8c060';
  /* subtle glow */
  ctx.shadowColor = 'rgba(232,192,96,0.18)';
  ctx.shadowBlur  = 30;
  ctx.fillText('ORDER NOW', W/2, divY+194);
  ctx.fillText('TO LOCK IN', W/2, divY+322);
  ctx.shadowBlur = 0;

  ctx.letterSpacing = '1px';
  ctx.font      = "24px 'Courier New',monospace";
  ctx.fillStyle = '#3a3a56';
  ctx.fillText('Mention "flash" when you reach out  ·  While slots last', W/2, divY+378);

  /* ─── FOOTER ─── */
  const ftDivY = H-100;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad,ftDivY); ctx.lineTo(W-pad,ftDivY); ctx.stroke();

  ctx.letterSpacing = '2px';
  ctx.font      = "20px 'Courier New',monospace";
  ctx.textAlign = 'left';
  ctx.fillStyle = '#2c2c42';
  ctx.fillText('21+ only  ·  Local laws apply', pad, H-55);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(201,160,64,0.28)';
  ctx.fillText('THE LEDGER', W-pad, H-55);
}

draw();

/* ── Save as PNG ── */
function savePNG(){
  const btn = document.getElementById('btn');
  btn.textContent = '...';
  btn.disabled = true;
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-flash-sale.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    btn.textContent = '✓ Saved!';
    setTimeout(() => { btn.textContent = '⬇ Save to Gallery'; btn.disabled = false; }, 2200);
  }, 'image/png');
}
</script>
</body>
</html>
